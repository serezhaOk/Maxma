<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Исследование программ лояльности 2025</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: #f0f0f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* ─── Card ─── */
    .lm-card {
      background: #cfecfc;
      border: 4px solid #fff;
      border-radius: 16px;
      display: flex;
      align-items: flex-start;
      gap: 32px;
      padding: 40px 20px;
      width: 100%;
      max-width: 740px;
    }

    /* ─── Poster ─── */
    .lm-poster {
      flex: 0 0 255px;
      aspect-ratio: 255 / 360;
      border: 1px solid #adadad;
      border-radius: 1px 6px 6px 1px;
      box-shadow: 9px 13px 18px rgba(0, 0, 0, 0.13);
      overflow: hidden;
      position: relative;
    }

    .lm-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .lm-poster__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.6) 2%, rgba(255,255,255,0) 4.877%);
    }

    /* ─── Form ─── */
    .lm-form {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .lm-form__header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lm-form__title {
      font-weight: 700;
      font-size: 26px;
      line-height: 30px;
      color: #312d48;
    }

    .lm-form__subtitle {
      font-weight: 400;
      font-size: 15px;
      line-height: 20px;
      color: rgba(49, 45, 72, 0.55);
    }

    /* ─── Inputs ─── */
    .lm-row {
      display: flex;
      gap: 12px;
    }

    .lm-input {
      flex: 1;
      height: 46px;
      background: #fff;
      border: 1px solid rgba(113, 108, 144, 0.35);
      border-radius: 100px;
      padding: 0 18px;
      font-family: 'Rubik', sans-serif;
      font-size: 15px;
      color: #312d48;
      outline: none;
      transition: border-color 0.2s;
      min-width: 0;
    }

    .lm-input::placeholder {
      color: #a29fb2;
    }

    .lm-input:focus {
      border-color: rgba(113, 108, 144, 0.7);
    }

    /* ─── Button ─── */
    .lm-btn {
      width: 100%;
      height: 50px;
      background: #312d48;
      border: none;
      border-radius: 100px;
      padding: 0 20px;
      font-family: 'Rubik', sans-serif;
      font-weight: 500;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .lm-btn:hover {
      opacity: 0.88;
    }

    /* ─── Agreement ─── */
    .lm-agreement {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .lm-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .lm-checkbox {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      background: #fff;
      border: 1.5px solid rgba(113, 108, 144, 0.5);
      border-radius: 4px;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      position: relative;
    }

    .lm-checkbox:checked {
      background: #312d48;
      border-color: #312d48;
    }

    .lm-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 1px;
      width: 8px;
      height: 5px;
      border-left: 1.5px solid #fff;
      border-bottom: 1.5px solid #fff;
      transform: rotate(-45deg);
    }

    .lm-checkbox-label {
      font-size: 14px;
      line-height: 16px;
      letter-spacing: -0.14px;
      color: #312d48;
      white-space: nowrap;
    }

    .lm-legal {
      font-size: 14px;
      line-height: 16px;
      letter-spacing: -0.14px;
      color: #312d48;
    }

    /* ═══════════════════════════════════════
       MOBILE — 390px
    ═══════════════════════════════════════ */
    @media (max-width: 600px) {
      body {
        padding: 16px;
        align-items: flex-start;
      }

      .lm-card {
        flex-direction: column;
        gap: 20px;
        padding: 20px 16px 24px;
        max-width: 390px;
        border-width: 3px;
      }

      /* Poster: horizontal strip at top */
      .lm-poster {
        flex: none;
        width: 100%;
        aspect-ratio: 358 / 140;
        border-radius: 8px;
        overflow: hidden;
      }

      .lm-poster img {
        object-position: center 20%;
      }

      .lm-form__title {
        font-size: 22px;
        line-height: 26px;
      }

      .lm-form__subtitle {
        font-size: 14px;
        line-height: 18px;
      }

      /* Stack inputs vertically */
      .lm-row {
        flex-direction: column;
        gap: 10px;
      }

      .lm-input {
        height: 48px;
        font-size: 15px;
      }

      .lm-btn {
        height: 52px;
        font-size: 16px;
      }

      .lm-checkbox-label {
        white-space: normal;
      }
    }
  </style>
</head>
<body>

<div class="lm-card">

  <!-- Poster image -->
  <div class="lm-poster">
    <img
      src="https://www.figma.com/api/mcp/asset/ade763af-3544-4d7d-ad2a-0e830ea14e37"
      alt="Исследование программ лояльности 2025"
    />
    <div class="lm-poster__overlay"></div>
  </div>

  <!-- Form -->
  <div class="lm-form">

    <div class="lm-form__header">
      <p class="lm-form__title">Исследование программ лояльности 2025</p>
      <p class="lm-form__subtitle">Оставьте контакты — пришлём PDF с результатами на почту</p>
    </div>

    <div class="lm-row">
      <input class="lm-input" type="text" placeholder="Имя" />
      <input class="lm-input" type="text" placeholder="Компания" />
    </div>

    <div class="lm-row">
      <input class="lm-input" type="tel" placeholder="Телефон" />
      <input class="lm-input" type="email" placeholder="Email" />
    </div>

    <button class="lm-btn" type="button">Скачать исследование</button>

    <div class="lm-agreement">
      <label class="lm-checkbox-row">
        <input class="lm-checkbox" type="checkbox" />
        <span class="lm-checkbox-label">Соглашаюсь на получение рекламы</span>
      </label>
      <p class="lm-legal">
        Оставляя заявку, вы соглашаетесь на обработку персональных данных
      </p>
    </div>

  </div>
</div>

</body>
</html>
